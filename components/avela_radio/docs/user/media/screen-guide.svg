<svg xmlns="http://www.w3.org/2000/svg" width="790" height="370" viewBox="0 0 790 370" role="img" aria-labelledby="title description">
<title id="title">Radio screen explained</title><desc id="description">A native 320 by 170 screen with callouts: 1 LIVE; 2 volume; 3 Wi-Fi; 4 time and date; 5 station and track; 6 stream format; 7 spectrum.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#243a3c}.label{font-size:17px}.number{font-size:13px;font-weight:600;fill:#f8f6ef;text-anchor:middle;dominant-baseline:central}.leader{fill:none;stroke:#8c6037;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.region{fill:none;stroke:#d2af6d;stroke-width:1}</style>
